name: CI

on:
  push:
    branches: [master]
  pull_request:

# A superseded run of the same branch is of no interest.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Current Ubuntu LTS.
          - name: ubuntu-24.04 gcc
            os: ubuntu-24.04
            cc: gcc
            options: -DENABLE_PYTHON=ON -DBUILD_SHARED_LIB=ON
            python: true
          # Apple silicon runner.
          - name: macos-15 clang
            os: macos-15
            cc: clang
            options: -DENABLE_PYTHON=ON -DBUILD_SHARED_LIB=ON
            python: true
          # The static library on its own, which is how a statically linked
          # Ubertooth build takes libbtbb. Nothing in the python tools depends
          # on which library is built, so this job leaves them out.
          - name: ubuntu-24.04 gcc static only
            os: ubuntu-24.04
            cc: gcc
            options: -DENABLE_PYTHON=OFF -DBUILD_SHARED_LIB=OFF -DBUILD_STATIC_LIB=ON
            python: false
    steps:
      - uses: actions/checkout@v5

      # The Ubuntu runner image carries CMake 3.31, and the point is to build
      # with current CMake 4. The macOS image already has 4.x.
      - name: Install CMake 4
        if: runner.os == 'Linux'
        run: |
          python3 -m venv "$RUNNER_TEMP/cmake"
          "$RUNNER_TEMP/cmake/bin/pip" install --quiet "cmake==4.4.4"
          echo "$RUNNER_TEMP/cmake/bin" >> "$GITHUB_PATH"

      - name: Versions
        run: |
          cmake --version
          ${CC:-cc} --version
        env:
          CC: ${{ matrix.cc }}

      - name: Configure
        # The vendored uthash.h falls through between switch cases on purpose,
        # which gcc reports: that one warning stays visible but not fatal.
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          ${{ matrix.options }}
          -DCMAKE_C_FLAGS="-Wall -Wextra -Werror -Wno-error=implicit-fallthrough"
        env:
          CC: ${{ matrix.cc }}

      - name: Build
        run: cmake --build build -j

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Install
        run: cmake --install build --prefix "$RUNNER_TEMP/prefix"

      # The install rule has to put the pcapdump module where the installed
      # btaptap finds it, which is not where the interpreter looks.
      - name: Run the installed tool
        if: matrix.python
        run: |
          "$RUNNER_TEMP/prefix/bin/btaptap" -h
          # The keystrokes the recorded Ellisys export holds, from the copy
          # that is installed. Not through a pipe: that would hide the tool's
          # exit status.
          "$RUNNER_TEMP/prefix/bin/btaptap" \
              -e python/pcaptools/tests/ellysis-keyboard.csv \
              > "$RUNNER_TEMP/keystrokes"
          cat "$RUNNER_TEMP/keystrokes"
          grep -q "Return" "$RUNNER_TEMP/keystrokes"

  sanitizers:
    name: ubuntu-24.04 clang asan+ubsan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install CMake 4
        run: |
          python3 -m venv "$RUNNER_TEMP/cmake"
          "$RUNNER_TEMP/cmake/bin/pip" install --quiet "cmake==4.4.4"
          echo "$RUNNER_TEMP/cmake/bin" >> "$GITHUB_PATH"

      - name: Versions
        run: |
          cmake --version
          clang --version

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Debug
          -DENABLE_PYTHON=OFF
          -DCMAKE_C_FLAGS="-Wall -Wextra -Werror -Wno-error=implicit-fallthrough -g -fno-omit-frame-pointer -fsanitize=address,undefined -fno-sanitize-recover=all"
        env:
          CC: clang

      - name: Build
        run: cmake --build build -j

      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: print_stacktrace=1
        shell: bash
        # -V so sanitizer output from passing tests is in the log too.
        run: ctest --test-dir build -V 2>&1 | tee ctest.log

      - name: Report sanitizer findings
        # Also, and especially, when the tests failed.
        if: always()
        run: |
          if grep -q "runtime error" ctest.log; then
            grep "runtime error" ctest.log | sort -u | while read -r line; do
              echo "::warning title=UBSan::$line"
            done
          else
            echo "no UBSan findings"
          fi

  fuzz:
    name: ubuntu-24.04 clang fuzz
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install CMake 4
        run: |
          python3 -m venv "$RUNNER_TEMP/cmake"
          "$RUNNER_TEMP/cmake/bin/pip" install --quiet "cmake==4.4.4"
          echo "$RUNNER_TEMP/cmake/bin" >> "$GITHUB_PATH"

      - name: Versions
        run: |
          cmake --version
          clang --version

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Debug
          -DENABLE_PYTHON=OFF
          -DCMAKE_C_FLAGS="-Wall -Wextra -Werror -Wno-error=implicit-fallthrough -g -fno-omit-frame-pointer -fsanitize=address,undefined -fno-sanitize-recover=all"
        env:
          CC: clang

      - name: Build
        run: >
          cmake --build build -j
          --target fuzz_find_ac fuzz_bredr fuzz_le fuzz_pcap fuzz_pcapng

      # A minute each, from the seed corpus in the tree, which is long enough
      # to tell that a target still reaches into the library and short enough
      # for every pull request. The corpus is copied, so that what a run finds
      # is not kept.
      - name: Fuzz
        env:
          UBSAN_OPTIONS: print_stacktrace=1
        shell: bash
        run: |
          for target in find_ac bredr le pcap pcapng; do
            corpus="$RUNNER_TEMP/corpus/$target"
            mkdir -p "$corpus"
            cp tests/fuzz/corpus/"$target"/* "$corpus/"
            echo "::group::fuzz_$target"
            ./build/tests/fuzz/"fuzz_$target" \
              -max_total_time=60 -max_len=512 -close_fd_mask=1 \
              -print_final_stats=1 \
              -artifact_prefix="$RUNNER_TEMP/artifacts-$target-" \
              "$corpus"
            echo "::endgroup::"
          done

      - name: The input a failing target stopped on
        if: failure()
        run: |
          for artifact in "$RUNNER_TEMP"/artifacts-*; do
            test -e "$artifact" || continue
            echo "== $artifact"
            xxd "$artifact"
          done
